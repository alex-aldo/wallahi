<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hehehe</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rose: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                        },
                        gold: {
                            300: '#fde047',
                            400: '#facc15',
                            500: '#eab308',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'heartbeat': 'heartbeat 1.5s ease-in-out infinite',
                        'bounce-subtle': 'bounceSubtle 2s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-15px) rotate(3deg)' }
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, boxShadow: '0 0 25px rgba(244, 63, 94, 0.6), 0 0 50px rgba(244, 63, 94, 0.3)' },
                            '50%': { opacity: 0.85, boxShadow: '0 0 10px rgba(244, 63, 94, 0.3), 0 0 20px rgba(244, 63, 94, 0.1)' }
                        },
                        heartbeat: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '14%': { transform: 'scale(1.15)' },
                            '28%': { transform: 'scale(1)' },
                            '42%': { transform: 'scale(1.15)' },
                            '70%': { transform: 'scale(1)' }
                        },
                        bounceSubtle: {
                            '0%, 100%': { transform: 'translateY(-5%)', animationTimingFunction: 'cubic-bezier(0.8,0,1,1)' },
                            '50%': { transform: 'none', animationTimingFunction: 'cubic-bezier(0,0,0.2,1)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0f051d 0%, #290a29 40%, #1a0826 100%);
            color: #fce7f3;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card-pink {
            background: rgba(244, 63, 94, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(251, 113, 133, 0.25);
            box-shadow: 0 8px 32px 0 rgba(244, 63, 94, 0.2);
        }

        .text-glow {
            text-shadow: 0 0 12px rgba(244, 63, 94, 0.7), 0 0 25px rgba(244, 63, 94, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 5, 29, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(244, 63, 94, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(244, 63, 94, 0.7);
        }

        /* Background particle canvas */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .interactive-layer {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-rose-500 selection:text-white flex flex-col min-h-screen">

    <!-- Particle Background Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Top Music Control Bar -->
    <header class="fixed top-4 right-4 z-50 flex items-center gap-3">
        <button id="music-toggle-btn" class="glass-card px-4 py-2 rounded-full flex items-center gap-2 text-xs md:text-sm font-medium hover:bg-rose-500/20 transition-all border border-rose-400/30 shadow-lg text-rose-200">
            <i class="fa-solid fa-music text-rose-400 animate-pulse" id="music-icon"></i>
            <span id="music-text">Play Romantic Synth</span>
        </button>
    </header>

    <!-- Main Interactive Container -->
    <main class="flex-grow flex items-center justify-center p-4 md:p-6 interactive-layer">
        <div class="w-full max-w-2xl">

            <!-- VIEW 1: QUESTION VIEW -->
            <div id="view-confession" class="glass-card-pink rounded-3xl p-6 md:p-10 text-center relative overflow-hidden transition-all duration-500 transform scale-100">
                
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Animated Heart Icon -->
                <div class="mb-6 inline-block relative">
                    <i class="fa-solid fa-heart text-6xl md:text-7xl text-rose-500 animate-heartbeat drop-shadow-[0_0_15px_rgba(244,63,94,0.8)]"></i>
                    <i class="fa-solid fa-sparkles text-amber-300 text-xl absolute -top-2 -right-2 animate-bounce"></i>
                </div>

                <!-- Main Confession Question -->
                <h1 class="font-sans text-4xl sm:text-6xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-200 via-pink-300 to-rose-400 mb-6 text-glow leading-tight tracking-tight">
                    wanna be mine?
                </h1>

                <!-- Subtitle / Hint -->
                <p class="font-sans text-lg md:text-xl font-medium text-rose-200/90 mb-8 max-w-lg mx-auto">
                    pls dijawab
                </p>

                <!-- Interactive Buttons Container -->
                <div id="button-container" class="relative min-h-[120px] flex flex-col sm:flex-row items-center justify-center gap-4 mt-6">
                    
                    <!-- YES BUTTON -->
                    <button id="yes-btn" class="z-20 px-8 py-4 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold rounded-full shadow-[0_0_30px_rgba(244,63,94,0.6)] hover:shadow-[0_0_45px_rgba(244,63,94,0.9)] transform hover:scale-105 transition-all duration-300 flex items-center gap-3 text-lg md:text-xl">
                        <i class="fa-solid fa-heart"></i>
                        <span>YES! Absolutely!</span>
                    </button>

                    <!-- NO BUTTON (EVASIVE) -->
                    <button id="no-btn" class="z-10 px-6 py-3 bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-semibold rounded-full border border-slate-600/50 shadow-md transition-all duration-200 text-sm md:text-base cursor-pointer">
                        <span id="no-btn-text">No</span>
                    </button>
                </div>

                <p id="no-hint" class="text-xs text-rose-300/60 mt-6 italic h-4 transition-opacity duration-300 opacity-0">
                    Hmm... looks like "No" is playing hard to get! 😉
                </p>
            </div>


            <!-- VIEW 2: CELEBRATION VIEW -->
            <div id="view-celebration" class="glass-card rounded-3xl p-6 md:p-10 text-center relative overflow-hidden hidden transition-all duration-700 transform scale-95 opacity-0">
                
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-32 bg-rose-500/20 blur-3xl pointer-events-none"></div>

                <!-- Date Badge Header -->
                <div class="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-rose-500/20 border border-rose-400/40 text-rose-200 font-semibold text-sm md:text-base mb-6 animate-bounce-subtle">
                    <i class="fa-solid fa-calendar-heart text-rose-400"></i>
                    <span>19/09/2026</span>
                    <i class="fa-solid fa-sparkles text-amber-300"></i>
                </div>

                <!-- Celebration Headline -->
                <h2 class="font-sans text-3xl sm:text-5xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-200 via-rose-300 to-amber-200 mb-6 text-glow tracking-tight uppercase leading-snug">
                    WERE OFFICIALLY DATING WOOOOOOHOOOOOOOO
                </h2>

                <!-- Love Letter Box -->
                <div class="glass-card-pink rounded-2xl p-6 md:p-8 text-left my-6 border border-rose-300/30 shadow-inner relative">
                    <div class="absolute top-3 right-4 text-rose-400/30 text-4xl font-sans">“</div>
                    <p class="font-sans text-base md:text-lg text-rose-100 leading-relaxed font-normal mb-4">
                        Thank you for saying YES! May our journey together be filled with love, laughter, and endless happy moments.
                    </p>
                    <div class="text-right font-sans text-xl font-bold text-rose-300 mt-4">
                        aldorodo 💕
                    </div>
                </div>

                <!-- Replay Confetti Button -->
                <div class="flex items-center justify-center gap-4 mt-8">
                    <button id="replay-celebration-btn" class="px-6 py-3 rounded-full bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white text-sm md:text-base font-bold shadow-lg transition-all flex items-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> More Confetti!
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast-message" class="fixed bottom-6 right-6 z-50 glass-card-pink px-5 py-3 rounded-2xl text-sm font-medium text-rose-100 border border-rose-400/40 shadow-2xl flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <i class="fa-solid fa-heart text-rose-400"></i>
        <span id="toast-text">Notification message</span>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Evasive No Button Texts
        const noButtonTexts = [
            "No",
            "Are you sure?",
            "Think again! 🥺",
            "Try again! 😜",
            "You can't catch me!",
            "Nice try! 💕",
            "Wrong button! 😘",
            "Click YES instead!",
            "Never! ❤️"
        ];
        let noClickCount = 0;

        // Audio Context Synthesizer
        let audioCtx = null;
        let isMusicPlaying = false;
        let synthInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playChime(freq = 523.25, type = 'sine', duration = 0.4) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio waiting for user gesture");
            }
        }

        function toggleBackgroundSynth() {
            initAudio();
            const musicText = document.getElementById('music-text');

            if (isMusicPlaying) {
                clearInterval(synthInterval);
                isMusicPlaying = false;
                musicText.innerText = "Play Romantic Synth";
                showToast("Music paused");
            } else {
                isMusicPlaying = true;
                musicText.innerText = "Pause Melody 🎶";
                showToast("Playing soothing ambient melody ✨");

                const notes = [261.63, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
                let step = 0;

                synthInterval = setInterval(() => {
                    const note = notes[step % notes.length];
                    playChime(note, 'sine', 1.2);
                    step = (step + Math.floor(Math.random() * 3) + 1) % notes.length;
                }, 600);
            }
        }

        // Particle System for Canvas Background
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 12 + 6;
                this.speedY = Math.random() * 1.2 + 0.5;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 1.5;
                this.color = ['#f43f5e', '#fb7185', '#fda4af', '#eab308', '#ec4899'][Math.floor(Math.random() * 5)];
            }

            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y * 0.01) * 0.5;
                this.rotation += this.rotationSpeed;

                if (this.y < -20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;

                const topCurveHeight = this.size * 0.3;
                ctx.beginPath();
                ctx.moveTo(0, topCurveHeight);
                ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
                ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
                ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
                ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const particleCount = Math.min(Math.floor(window.innerWidth / 20), 40);
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // Evasive No Button Functionality
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const buttonContainer = document.getElementById('button-container');
        const noHint = document.getElementById('no-hint');

        function moveNoButton() {
            noClickCount++;
            playChime(300 + Math.random() * 200, 'sine', 0.15);

            const textIndex = Math.min(noClickCount, noButtonTexts.length - 1);
            document.getElementById('no-btn-text').innerText = noButtonTexts[textIndex];

            // Yes Button grows larger
            const yesScale = 1 + (noClickCount * 0.12);
            yesBtn.style.transform = `scale(${Math.min(yesScale, 1.8)})`;

            const maxX = Math.min(window.innerWidth - noBtn.offsetWidth - 40, 250);
            const maxY = Math.min(window.innerHeight - noBtn.offsetHeight - 40, 150);

            const randomX = (Math.random() - 0.5) * maxX * 2;
            const randomY = (Math.random() - 0.5) * maxY * 2;

            noBtn.style.position = 'relative';
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px) scale(${Math.max(0.6, 1 - noClickCount * 0.05)})`;

            if (noClickCount > 2) {
                noHint.classList.remove('opacity-0');
            }
        }

        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Trigger Celebration
        yesBtn.addEventListener('click', triggerCelebration);

        function triggerCelebration() {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                setTimeout(() => playChime(freq, 'triangle', 0.6), idx * 120);
            });

            if (typeof confetti === 'function') {
                const count = 200;
                const defaults = { origin: { y: 0.7 } };

                function fire(particleRatio, opts) {
                    confetti(Object.assign({}, defaults, opts, {
                        particleCount: Math.floor(count * particleRatio)
                    }));
                }

                fire(0.25, { spread: 26, startVelocity: 55, colors: ['#f43f5e', '#fda4af'] });
                fire(0.2, { spread: 60, colors: ['#eab308', '#ffffff'] });
                fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
                fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, colors: ['#f43f5e', '#eab308'] });
                fire(0.1, { spread: 120, startVelocity: 45 });
            }

            const confessionView = document.getElementById('view-confession');
            const celebrationView = document.getElementById('view-celebration');

            confessionView.style.opacity = '0';
            confessionView.style.transform = 'scale(0.9)';

            setTimeout(() => {
                confessionView.classList.add('hidden');
                celebrationView.classList.remove('hidden');

                setTimeout(() => {
                    celebrationView.style.opacity = '1';
                    celebrationView.style.transform = 'scale(1)';
                }, 50);
            }, 400);

            showToast("WOOOOOHOOOOOOOO! 🎉❤️");
        }

        document.getElementById('music-toggle-btn').addEventListener('click', toggleBackgroundSynth);
        document.getElementById('replay-celebration-btn').addEventListener('click', triggerCelebration);

        function showToast(message) {
            const toast = document.getElementById('toast-message');
            document.getElementById('toast-text').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');

            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
